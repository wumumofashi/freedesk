name: Build FreeDesk

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.5.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach git pull origin master

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rust-src

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download Sciter
        run: |
          New-Item -ItemType Directory -Force -Path "target/debug"
          Invoke-WebRequest -Uri "https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x64/sciter.dll" -OutFile "target/debug/sciter.dll"

      - name: Build
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Package
        run: |
          $version = "${{ github.event.inputs.version }}"
          $outdir = "output\FreeDesk-$version"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null
          Copy-Item "target/release/rustdesk.exe" "$outdir\FreeDesk.exe"
          Copy-Item "target/debug/sciter.dll" "$outdir/"
          $cfg = "[options]`nrendezvous_servers=156.229.162.45:21116`nrelay_servers=156.229.162.45:21117`n"
          Set-Content -Path "$outdir\rustdesk.conf" -Value $cfg
          Get-ChildItem $outdir

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FreeDesk-$version
          path: output/
          retention-days: 30
